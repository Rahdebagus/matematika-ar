<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1020" />
    <title>Matematika AR</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <!-- Urutan tumpukan di dalam #app: video (z0) < canvas WebGL (z1) < UI (z2). -->
    <div id="app">
      <div id="ar-screen">
        <button id="ar-back" type="button">&larr; Menu</button>
        <div id="ui">
          <p id="status">Arahkan kamera ke kartu penanda</p>
        </div>
      </div>
    </div>

    <!-- Menu, Panduan, Tentang. Menutupi tampilan AR saat aktif. -->
    <div id="screens"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
